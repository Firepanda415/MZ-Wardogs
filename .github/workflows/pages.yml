name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node test.mjs
      - run: node tests/routing.mjs
      - run: |
          mkdir _site
          cp index.html style.css app.js core.mjs map-assets.mjs roads-*.mjs routing.mjs favicon.svg THIRD_PARTY_NOTICES.md _site/
          mkdir -p _site/assets _site/docs
          cp -r assets/maps-display _site/assets/
          cp docs/road-review-3d.json _site/docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
