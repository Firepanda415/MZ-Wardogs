<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>熊猫滑板日记</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #edf1e9; color: #253c35; font-family: system-ui, "Microsoft YaHei", sans-serif; padding: 24px; }
  main { width: min(100%, 1060px); position: relative; overflow: hidden; border-radius: 28px; background: #f9f7ee; box-shadow: 0 24px 80px #233d3410; }
  header { position: absolute; z-index: 1; top: 32px; left: 38px; right: 38px; display: flex; justify-content: space-between; align-items: center; gap: 16px; font-size: 13px; letter-spacing: 2px; }
  header span:last-child { font-size: 10px; letter-spacing: 3px; }
  h1 { position: absolute; top: 87px; left: 38px; z-index: 1; margin: 0; font-size: clamp(24px, 4.2vw, 46px); font-weight: 800; letter-spacing: -2px; line-height: 1.3; }
  h1 small { display: block; margin-top: 14px; font-size: 11px; font-weight: 500; letter-spacing: 3px; }
  svg { display: block; width: 100%; height: auto; }
  footer { display: flex; align-items: center; justify-content: space-between; padding: 18px 38px 25px; gap: 16px; font-size: 12px; }
  footer p { margin: 0; letter-spacing: 1px; }
  .pause { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 10px 14px; border: 1px solid #c5d1c5; border-radius: 30px; white-space: nowrap; }
  input { accent-color: #2b6957; width: 16px; height: 16px; margin: 0; }
  main:has(input:checked) svg * { animation-play-state: paused !important; }
  .rider { animation: cruise 3s ease-in-out infinite; transform-origin: 525px 465px; }
  .body { animation: bob 1.4s ease-in-out infinite; transform-origin: 527px 419px; }
  .head { animation: nod 1.4s ease-in-out infinite; transform-origin: 546px 287px; }
  .kick { animation: push 3s ease-in-out infinite; transform-origin: 498px 363px; }
  .scarf { animation: flutter .7s ease-in-out infinite alternate; transform-origin: 493px 292px; }
  .wheel { transform-box: fill-box; transform-origin: center; animation: spin .65s linear infinite; }
  .road { animation: roll 1.15s linear infinite; }
  .trees { animation: roll 10s linear infinite; }
  .cloud { animation: drift 8s ease-in-out infinite alternate; }
  .wind { animation: wind 1.5s ease-out infinite; }
  .shadow { animation: shadow 3s ease-in-out infinite; transform-origin: 530px 488px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes roll { to { transform: translateX(-400px); } }
  @keyframes cruise { 0%, 100% { transform: translateX(-8px) rotate(-1deg); } 50% { transform: translateX(12px) rotate(1deg); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(5px); } }
  @keyframes nod { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(2deg); } }
  @keyframes push { 0%, 12%, 80%, 100% { transform: rotate(0); } 35% { transform: rotate(28deg); } 55% { transform: rotate(42deg); } }
  @keyframes flutter { to { transform: rotate(-9deg) scaleX(.94); } }
  @keyframes drift { to { transform: translateX(-25px); } }
  @keyframes wind { 0% { opacity: 0; transform: translateX(20px); } 30% { opacity: .7; } 100% { opacity: 0; transform: translateX(-65px); } }
  @keyframes shadow { 50% { transform: translateX(12px) scaleX(.95); opacity: .65; } }
  @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; } }
  @media (max-width: 600px) { body { padding: 12px; } main { border-radius: 20px; } header { top: 20px; left: 22px; right: 22px; font-size: 10px; } header span:last-child { font-size: 8px; letter-spacing: 1px; } h1 { top: 62px; left: 22px; font-size: 25px; } h1 small { font-size: 8px; margin-top: 7px; letter-spacing: 1px; } footer { padding: 14px 20px 20px; font-size: 10px; } svg { min-height: 390px; object-fit: cover; } }
</style>
